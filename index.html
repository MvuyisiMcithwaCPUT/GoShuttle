<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoShuttle — Sign In</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="LoginAndRegisterStyle.css">
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span>09:41</span>
    <span class="icons">
      <i class="fa-solid fa-signal"></i>
      <i class="fa-solid fa-wifi"></i>
      <i class="fa-solid fa-battery-full"></i>
    </span>
  </div>

  <div class="hero">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="4" width="18" height="13" rx="3" fill="#22337a"/>
        <rect x="5.5" y="6.5" width="13" height="5" rx="1" fill="#fff"/>
        <circle cx="7.5" cy="19" r="1.6" fill="#22337a"/>
        <circle cx="16.5" cy="19" r="1.6" fill="#22337a"/>
      </svg>
    </div>
    <h1>Welcome back</h1>
    <p>Sign in to track buses &amp; manage your pass</p>
  </div>

  <form class="form-panel" id="signInForm" novalidate>
    <div class="field">
      <label for="studentId">Student Number / Email</label>
      <div class="input-wrap" id="studentIdWrap">
        <span class="icon"><i class="fa-solid fa-user"></i></span>
        <input type="text" id="studentId" name="studentId" placeholder="e.g. 219344639" autocomplete="username">
      </div>
      <div class="error-msg" id="studentIdError">Please enter your student number or email.</div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap" id="passwordWrap">
        <span class="icon"><i class="fa-solid fa-lock"></i></span>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <div class="error-msg" id="passwordError">Please enter your password.</div>
    </div>

    <div class="forgot-row">
      <a href="#" id="forgotPassword">Forgot password?</a>
    </div>

    <button type="submit" class="btn-primary" id="signInBtn">Sign In</button>

    <div class="divider">or continue with</div>

    <div class="oauth-row">
      <button type="button" class="btn-oauth" id="googleBtn">
        <i class="fa-brands fa-google"></i> Google
      </button>
      <button type="button" class="btn-oauth" id="cputBtn">
        <i class="fa-solid fa-building-columns"></i> CPUT Student Email
      </button>
    </div>

    <div class="switch-row">
      Don't have an account? <a class="link" href="register.html">Register</a>
    </div>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="LoginAndRegisterScript.js"></script>
</body>
</html>
