<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoShuttle — Live Track</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="AppStyle.css" />
</head>
<body>
  <div class="phone">
    <div class="status-bar">
      <span>09:41</span>
      <span class="icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </span>
    </div>

    <div class="app-header">
      <button class="back" type="button" aria-label="Back">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="4" width="18" height="13" rx="3" fill="#22337a"/>
          <rect x="5.5" y="6.5" width="13" height="5" rx="1" fill="#fff"/>
          <circle cx="7.5" cy="19" r="1.6" fill="#22337a"/>
          <circle cx="16.5" cy="19" r="1.6" fill="#22337a"/>
        </svg>
      </div>
      <h2 id="busHeading">GS-112 • Khayelitsha → CPUT Bellville</h2>
      <p>Live tracking</p>
    </div>

    <div class="content">
      <div class="map-grid">
        <div class="location">Site B</div>
        <div class="location">Site C</div>
        <div class="location active">Delft</div>
        <div class="location">CPUT Bellville</div>
        <div class="bus-icon" aria-hidden="true">
          <i class="fa-solid fa-bus"></i>
        </div>
      </div>

      <div class="bus-info">
        <h3>Bus #GS-112</h3>
        <p>Route: Khayelitsha → CPUT Bellville</p>
        <p>Next stop: <strong>CPUT Bellville</strong></p>
        <p>ETA: <span class="on-time">~10 min · On Time</span></p>
      </div>
    </div>

    <nav class="bottom-nav">
      <button class="nav-home" type="button">
        <i class="fa-solid fa-house nav-icon"></i>
        Home
      </button>
      <button class="nav-track active" type="button">
        <i class="fa-solid fa-location-dot nav-icon"></i>
        Track
      </button>
      <button class="nav-schedule" type="button">
        <i class="fa-solid fa-calendar-days nav-icon"></i>
        Schedule
      </button>
      <button class="nav-pass" type="button">
        <i class="fa-solid fa-ticket nav-icon"></i>
        Pass
      </button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script src="track.js"></script>
</body>
</html>
